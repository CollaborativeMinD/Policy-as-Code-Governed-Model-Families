v_uvlo_v = { "annotation" = "float" }
v_ripple_pk_v = { "annotation" = "float" }
v_predicted_droop_v = { "annotation" = "float" }
v_reference_uncertainty_v = { "annotation" = "float" }

[calls."compute_thermal_derated_power_margin"]
