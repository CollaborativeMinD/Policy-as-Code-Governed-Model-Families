t_junction_c = { "annotation" = "float" }
t_warn_c = { "annotation" = "float" }
t_shutdown_c = { "annotation" = "float" }
aging_factor = { "annotation" = "float", "gt" = 0.0, "le" = 1.0 }
p_load_w = { "annotation" = "float", "ge" = 0 }
p_transient_reserve_w = { "annotation" = "float", "ge" = 0 }

[calls."compute_recovery_energy_margin"]
