clock_error_s = { "annotation" = "float" }

[calls."compute_hardware_closed_command_seam_gate"]
brownout_margin_v = { "annotation" = "float" }
freshness_margin_s = { "annotation" = "float" }
coherence_margin_s = { "annotation" = "float" }
timing_closure_margin_s = { "annotation" = "float" }
authority_gate = { "annotation" = "bool" }
