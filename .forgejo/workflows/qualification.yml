name: Governed Model Families qualification
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Verify model admission, Textual and MCP
    runs-on: station-linux
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        env:
          CHECKOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          import subprocess

          assert os.getuid() != 0
          assert not Path("/var/run/docker.sock").exists()
          token = base64.b64encode(f"x-access-token:{os.environ['CHECKOUT_TOKEN']}".encode()).decode()
          env = dict(os.environ, GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.extraHeader",
                     GIT_CONFIG_VALUE_0=f"Authorization: Basic {token}", GIT_TERMINAL_PROMPT="0")
          revision = os.environ["GITHUB_SHA"]
          remote = f"http://forgejo:3000/{os.environ['GITHUB_REPOSITORY']}.git"
          subprocess.run(["git", "init", "-q", "checkout"], check=True)
          subprocess.run(["git", "-C", "checkout", "fetch", "-q", "--depth=1", remote, revision], env=env, check=True)
          subprocess.run(["git", "-C", "checkout", "checkout", "-q", "--detach", "FETCH_HEAD"], check=True)
          assert subprocess.check_output(["git", "-C", "checkout", "rev-parse", "HEAD"], text=True).strip() == revision
          PY
      - name: Exercise contracts, release wheel and all three terminal roles
        working-directory: checkout
        run: |
          set -eu
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements-console.txt
          python -m pip check
          python -B -m unittest discover -s model_policy_engine/tests -v
          python -B verification/replay.py
          python -B verification/verify_wheel.py
          python -B tests/verify_console.py
          mkdir -p evidence
          cp verification/fixture-results.json verification/wheel-result.json verification/console-witness.json evidence/
          git rev-parse HEAD > evidence/revision.txt
      - name: Publish qualification evidence
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: governed-model-families
          path: checkout/evidence/
          if-no-files-found: error
